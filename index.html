<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vincent Moore - Linux | AI | DevOps</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    @font-face {
      font-family: 'Aptos';
      src: url('https://fonts.cdnfonts.com/s/114691/Aptos-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --background: #ffffff;
      --primary: #37173b;
      --accent: #e0b672;
      --muted: #555555;
      --font-main: 'Aptos', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-main);
      background-color: var(--background);
      color: var(--primary);
      overflow: hidden;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-color: rgba(255, 255, 255, 0.95);
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    .logo-img {
      width: 420px;
      height: auto;
      margin-bottom: 1em;
      animation: fadeIn 1.2s ease forwards;
    }

    .logo-text {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 1em;
      animation: fadeIn 1.5s ease forwards;
    }

    h1 {
      font-size: 2.8em;
      color: var(--primary);
      margin: 0.2em 0;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p {
      font-size: 1.2em;
      color: var(--muted);
      max-width: 500px;
      animation: fadeIn 2.5s ease forwards;
      animation-delay: 0.5s;
    }

    .footer {
      position: absolute;
      bottom: 1em;
      width: 100%;
      text-align: center;
      font-size: 0.9em;
      color: var(--muted);
      z-index: 1;
      animation: fadeIn 3s ease forwards;
      animation-delay: 1s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px var(--accent); }
      to { text-shadow: 0 0 15px var(--accent); }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      p {
        font-size: 1em;
        padding: 0 1em;
      }

      .logo-img {
        width: 180px;
      }

      .logo-text {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="content">
    <img src="logo.png" alt="Vincent Moore Logo" class="logo-img" />
    <h2>Coming Soon</h2>
    <p>I’m working on something incredible. This site is currently under development. Check back soon!</p>
  </div>
  <div class="footer">
    © <span id="year"></span> Vincent Moore. All rights reserved.
  </div>

  <!-- Load particles.js and inject year -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    // Particle Background Setup
    particlesJS("particles-js", {
      "particles": {
        "number": {
          "value": 70,
          "density": { "enable": true, "value_area": 800 }
        },
        "color": { "value": "#37173b" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.5, "random": true },
        "size": { "value": 3, "random": true },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#e0b672",
          "opacity": 0.4,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 1.5,
          "direction": "none",
          "random": false,
          "straight": false,
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "repulse" },
          "onclick": { "enable": true, "mode": "push" }
        },
        "modes": {
          "repulse": { "distance": 100 },
          "push": { "particles_nb": 4 }
        }
      },
      "retina_detect": true
    });

    // Auto year in footer
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
