
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon | Vincent Moore</title>
  <style>
    :root {
      --deep-purple: #37173b;
      --warm-gold: #e0b672;
      --earthy-wine: #803d4a;
      --rich-crimson: #a13643;
      --font-main: 'Segoe UI', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-main);
      background-color: var(--deep-purple);
      color: white;
      overflow: hidden;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    .logo-img {
      width: 120px;
      height: auto;
      margin-bottom: 1em;
      animation: fadeIn 1.2s ease forwards;
    }

    .logo-text {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--rich-crimson);
      text-transform: uppercase;
      margin-bottom: 1em;
      animation: fadeIn 1.5s ease forwards;
    }

    h1 {
      font-size: 2.8em;
      color: var(--warm-gold);
      margin: 0.2em 0;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p {
      font-size: 1.2em;
      color: #ddd;
      max-width: 500px;
      animation: fadeIn 2.5s ease forwards;
      animation-delay: 0.5s;
    }

    .footer {
      position: absolute;
      bottom: 1em;
      font-size: 0.9em;
      color: #aaa;
      z-index: 1;
      animation: fadeIn 3s ease forwards;
      animation-delay: 1s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px var(--warm-gold); }
      to { text-shadow: 0 0 20px var(--warm-gold); }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      p {
        font-size: 1em;
        padding: 0 1em;
      }

      .logo-img {
        width: 80px;
      }

      .logo-text {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="content">
    <img src="logo.png" alt="Vincent Moore Logo" class="logo-img" />
    <div class="logo-text">vincentmoore.ai</div>
    <h1>Coming Soon</h1>
    <p>I’m working on something incredible. This site is currently under development. Check back soon!</p>
  </div>
  <div class="footer">© 2025 Vincent Moore. All rights reserved.</div>

  <!-- Load particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": {
          "value": 70,
          "density": {
            "enable": true,
            "value_area": 800
          }
        },
        "color": {
          "value": "#e0b672"
        },
        "shape": {
          "type": "circle"
        },
        "opacity": {
          "value": 0.5,
          "random": true
        },
        "size": {
          "value": 3,
          "random": true
        },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#e0b672",
          "opacity": 0.3,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 1.5,
          "direction": "none",
          "random": false,
          "straight": false,
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": {
            "enable": true,
            "mode": "repulse"
          },
          "onclick": {
            "enable": true,
            "mode": "push"
          }
        },
        "modes": {
          "repulse": {
            "distance": 100
          },
          "push": {
            "particles_nb": 4
          }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
